# Conan has support for "profiles".
conan_setup_profile="default"

# C++ standard to enforce in the default Conan profile. Terminus projects
# require C++23, but conan profile detect uses the compiler's default
# (e.g. gnu17 for GCC 14), so we override it here.
conan_setup_cppstd="23"

# Maximum number of parallel build jobs Conan should use for compilation.
# Capping this limits memory pressure during heavy C++ builds (e.g. protobuf,
# ffmpeg). Override in ~/.conan-setup.cfg if your build machine has more RAM.
conan_setup_build_jobs="8"

# Dependency options Conan applies to every resolution using the default
# profile.  Centralizing these here (instead of in each repo's conanfile
# default_options) guarantees every Terminus project computes the same
# package ID for shared dependencies, so a package like OpenCV is built
# once per (os, arch, build_type) and reused everywhere.
#
# These options mirror terminus_conan/recipies/opencv/build-opencv.sh:
# a feature-rich, headless OpenCV (no X11/Wayland display backends; video
# IO via ffmpeg with VAAPI through libdrm).  On EL10 this also avoids the
# xorg/system recipe pulling the retired libXScrnSaver-devel package.
#
# conan_setup_options_common : applied on every OS.  Only include options
#                              the recipe defines on all platforms.
# conan_setup_options_linux  : applied only on Linux.  Use for options the
#                              recipe only defines there (e.g. ffmpeg's
#                              with_vaapi, opencv's with_wayland).
#
# Override either list in ~/.conan-setup.cfg to customize your builds.
conan_setup_options_common=(
    "opencv/*:shared=True"
    "opencv/*:text=True"
    "opencv/*:with_ffmpeg=True"
    "opencv/*:with_tesseract=True"
    "opencv/*:with_quirc=True"
    "opencv/*:with_jpeg2000=False"
    "opencv/*:with_openexr=False"
    "opencv/*:with_webp=False"
    "opencv/*:with_qt=False"
)

conan_setup_options_linux=(
    "opencv/*:with_gtk=False"
    "opencv/*:with_wayland=False"
    "ffmpeg/*:with_vaapi=True"
    "ffmpeg/*:with_vdpau=False"
    "ffmpeg/*:with_xcb=False"
    "ffmpeg/*:with_xlib=False"
    "ffmpeg/*:with_libdrm=True"
    "pulseaudio/*:with_x11=False"
    "pulseaudio/*:with_wayland=False"
)

# When set to "true", skip configuration of the Terminus remotes below and
# disable those remote names for this Conan home.  Other remotes, such as
# conancenter, remain available for public dependencies.  Override in
# ~/.conan-setup.cfg or via conan_setup_skip_remotes=true.
conan_setup_skip_remotes="false"

# Conan remote repositories.  Override this in ~/.conan-setup.cfg if your server
# address changes (e.g., a different hostname or IP for the Terminus Conan server).
conan_setup_repos["terminus-conan"]="http://rpi5:9300"
